services:
  api:
    build:
      context: ../backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Gadget Store OS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN}
      PAYSTACK_MODE: ${PAYSTACK_MODE:-disabled}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    environment:
      NEXT_BACKEND_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN}
      PAYSTACK_MODE: ${PAYSTACK_MODE:-disabled}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    profiles: ["release"]
